<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litho Process Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm lab narrator; one wafer, one film, ten scenes.
   IDEA: a cleanroom cutaway viewer, the wafer sliced like a cake under yellow-free light.
   PICTURE: a large live side-view of the wafer that changes step by step, with moving light, liquid, heat and plasma.
   COLOUR and TYPE: deep plum night, lavender oxide, peach photoresist, violet UV; Lexend + Noto Sans TC.
   LAYOUT: progress rail on top, the stage large, a caption column beside it; stacks on phones. */
:root{color-scheme:dark;--bg:#1b1730;--panel:#251f3a;--panel2:#342c50;--ink:#ece9f7;--mute:#a9a3c6;--lav:#6f63bc;--lavl:#c9c2f2;--peach:#edb27a;--peachd:#d98a3e;--warn:#f5a8a0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
.zh{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:18px max(3vw,14px) 6px}
header h1{font-size:clamp(22px,2.6vw,30px);line-height:1.1;margin:0}
header p{margin:0;color:var(--mute);font-size:14px}
.rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;padding:8px max(3vw,14px) 4px;position:relative}
.rail button{background:none;border:0;color:var(--mute);font:500 12px Lexend,sans-serif;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:4px 0;min-height:44px}
.rail .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid #6b6490;background:var(--panel);transition:all .4s}
.rail button.done .dot{background:var(--lav);border-color:var(--lav)}
.rail button.on .dot{background:var(--peach);border-color:var(--peach);transform:scale(1.35);box-shadow:0 0 0 6px rgba(237,178,122,.18)}
.rail button.on{color:var(--peach);font-weight:700}
.rail button:focus-visible,.ctl button:focus-visible{outline:2px solid var(--peach);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px;padding:8px max(3vw,14px) 22px;align-items:start}
.stage{background:var(--panel);border-radius:16px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:auto}
.cap{background:var(--panel);border-radius:16px;padding:22px 22px 18px}
.num{font-size:56px;font-weight:700;color:var(--peach);line-height:1}
.phase{font-size:13px;color:var(--mute);margin-top:6px}
.cap h2{font-size:clamp(28px,3vw,40px);line-height:1.08;margin:10px 0 2px;text-wrap:balance}
.term{font-size:20px;color:var(--lavl)}.term span{color:var(--mute);font-family:Lexend;font-size:16px;margin-left:8px}
.line{font-size:17px;margin:14px 0 16px;min-height:5.2em}
.key{background:var(--panel2);border-radius:12px;padding:12px 16px}
.key b{display:block;color:var(--peach);font-size:24px;line-height:1.2}
.key small{color:var(--ink);font-size:14px}
.warn{color:#f3d3cf;font-size:14px;margin-top:12px}.warn b{color:var(--warn)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid #3a3256;align-items:center}
.ctl button{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid #4a4270;background:var(--panel2);color:var(--ink);font:500 15px Lexend,sans-serif;cursor:pointer}
.ctl button.main{background:var(--lav);border-color:var(--lav);font-weight:700;min-width:120px}
.ctl button[aria-pressed=true]{background:var(--peach);color:#2d2840;border-color:var(--peach)}
.ctl .sp{flex:1}
.hint{color:var(--mute);font-size:13px;padding:0 max(3vw,14px) 20px}
.bar{position:absolute;left:0;bottom:0;height:3px;background:var(--peach);width:0}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.line{min-height:0}}
@media(max-width:600px){.rail button{font-size:0}.rail .dot{width:16px;height:16px}.num{font-size:40px}}
@media(prefers-reduced-motion:reduce){.rail .dot{transition:none}}
</style>
</head>
<body>
<header><h1>Photolithography · Process Cinema</h1><p>One wafer, ten steps, seen from the side. Use ← → or the buttons. <span class="zh">微影製程</span></p></header>

<main>
  <section class="stage" aria-label="Animated cross-section">
    <svg id="sv" viewBox="0 0 1000 560" role="img" aria-label="Side view of a silicon wafer during photolithography"></svg>
    <div class="ctl">
      <button id="prev" aria-label="Previous step">◀ Prev</button>
      <button id="play" class="main">▶ Play all</button>
      <button id="next" aria-label="Next step">Next ▶</button>
      <span class="sp"></span>
      <button id="snd" aria-pressed="true">Sound</button>
      <button id="voice" aria-pressed="false">Voice</button>
      <button id="neg" aria-pressed="false">Negative resist</button>
      <button id="fs">Fullscreen</button>
    </div>
    <div class="bar" id="bar"></div>
  </section>
  <aside class="cap" aria-live="polite">
    <div class="num" id="cnum">00</div><div class="phase" id="cphase"></div>
    <h2 id="ctitle"></h2><div class="term"><span class="zh" id="czh"></span><span id="cpy"></span></div>
    <p class="line" id="cline"></p>
    <div class="key"><b id="ckey"></b><small id="ckeyl"></small></div>
    <div class="warn" id="cwarn"></div>
  </aside>
</main>
<p class="hint">Keys: ← → step · Space play/pause · N negative resist · F fullscreen. Simplified schematic: the projection lens and real proportions are not shown.</p>

  if(k===3)P(18,(i,p)=>`<circle cx="${140+((i*131)%720)+Math.sin(t*3+i)*6}" cy="${RT-8-p*150}" r="4" fill="#c9c2f2" opacity="${1-p}"/>`);
  if(k===4&&t>1.4)h+=`<text x="230" y="160" fill="#ece9f7" font-size="15" font-family="Lexend">cameras match the marks</text>`;
  if(k===5&&t>0.9)P(20,(i,p)=>{const b=i%2?SPL.E1:SPL.E2;return`<circle cx="${b[0]+12+((i*37)%(b[1]-b[0]-24))}" cy="${100+p*(RT-100)}" r="3" fill="#fff" opacity="${0.7*(1-p)}"/>`});
  if(k===6&&t>0.6)['E1','E2'].forEach(e=>{const[a,b]=SPL[e];for(let j=0;j<4;j++)h+=`<text x="${a+15+j*25+Math.sin(t*4+j)*8}" y="${RT+30+Math.cos(t*3+j)*8}" fill="#9a5a14" font-size="14" font-weight="700" font-family="Lexend" opacity="${cl(t-0.6,0,1)}">H⁺</text>`});
  if(k===7&&t>0.6)P(16,(i,p)=>`<circle cx="${130+((i*113)%740)}" cy="${RT-6-p*34}" r="${2+p*3}" fill="none" stroke="#fff" opacity="${0.5*(1-p)}"/>`);
  if(k===8)h+=`<text x="230" y="160" fill="#ece9f7" font-size="15" font-family="Lexend">inspect: measure line widths</text>`;
  if(k===9&&t>1.0)P(26,(i,p)=>{const x=125+((i*61)%750);return`<line x1="${x}" y1="${180+p*170}" x2="${x}" y2="${200+p*170}" stroke="#f0abfc" stroke-width="3" opacity="${1-p*0.7}"/>`});
  if(k===10&&t>0.8&&t<2.6)P(14,(i,p)=>`<circle cx="${140+((i*89)%720)}" cy="${RT-p*120}" r="3" fill="#d9d4ea" opacity="${1-p}"/>`);
  if(k===11)for(let i=0;i<5;i++){if(t>0.5+i*0.55)[220,450,700].forEach(x=>h+=`<rect x="${x+(i%2?30:0)}" y="${OT-28-i*58}" width="14" height="28" fill="#8c86a8"/>`)}
  fx.innerHTML=h;
}
const DUR=(k)=>[7,7,8,7,7,7,7,8,6,8,7,7][k];
// ---------- sound (synthesised, no files) ----------
let AC=null,sound=true,voice=false;
const ac=()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC};
function noise(d){const a=ac(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;return s}
function env(g,a,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec)}
function sfx(name){if(!sound)return;const a=ac();if(!a)return;const t=a.currentTime,g=a.createGain();g.connect(a.destination);
  const osc=(type,f1,f2,d,peak=0.2,st=0)=>{const o=a.createOscillator(),gg=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t+st);o.frequency.exponentialRampToValueAtTime(f2,t+st+d);o.connect(gg);gg.connect(a.destination);env(gg,a,t+st,peak,0.01,d);o.start(t+st);o.stop(t+st+d+0.05)};
  const nz=(d,type,freq,peak,att=0.05)=>{const s=noise(d),f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);env(g,a,t,peak,att,d-att);s.start(t);s.stop(t+d)};
  if(name==='spray')nz(0.9,'bandpass',3500,0.25,0.2);
  if(name==='sizzle')nz(1.0,'highpass',5000,0.18,0.05);
  if(name==='slide')nz(0.7,'lowpass',600,0.35,0.3);
  if(name==='hum'){osc('sawtooth',110,112,1.2,0.08)}
  if(name==='flash'){osc('square',900,2400,0.25,0.07);nz(0.4,'highpass',6000,0.1,0.01)}
  if(name==='rise')osc('sine',300,900,0.5,0.18);
  if(name==='pop')osc('sine',700,200,0.12,0.25);
  if(name==='chime'){osc('sine',880,880,1.0,0.15);osc('sine',1320,1320,1.0,0.1,0.08)}
  if(name==='success')[523,659,784,1047].forEach((f,i)=>osc('triangle',f,f,0.35,0.14,i*0.12));
}
const CUES=[[[0.2,'rise']],[[0.3,'spray']],[[0.1,'rise'],[2.3,'spray']],[[0.3,'sizzle']],[[0.1,'slide'],[1.4,'pop']],[[0.3,'flash'],[0.9,'flash'],[1.6,'pop']],[[0.1,'slide'],[0.6,'sizzle']],[[0.3,'spray'],[1.5,'pop']],[[0.3,'sizzle']],[[0.3,'hum'],[1.0,'hum'],[1.8,'pop']],[[1.0,'pop'],[2.3,'chime']],[[0.5,'pop'],[1.05,'pop'],[1.6,'pop'],[2.15,'pop'],[2.7,'success']]];
function speak(i){try{speechSynthesis.cancel();if(!voice)return;const u=new SpeechSynthesisUtterance(STEPS[i].t+'. '+STEPS[i].l.replace(/[“”]/g,''));u.lang='en-US';u.rate=1;speechSynthesis.speak(u)}catch(e){}}
// ---------- UI ----------
const rail=document.getElementById('rail');
rail.innerHTML=NAMES.map((n,i)=>`<button data-i="${i+1}" aria-label="Step ${i+1}: ${n}"><span class="dot"></span>${n}</button>`).join('');
rail.addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)});
const $=id=>document.getElementById(id);
function go(i){step=cl(i,0,11);t0=performance.now();timers.forEach(clearTimeout);timers=CUES[step].map(([d,s])=>setTimeout(()=>sfx(s),d*1000));
  const S=STEPS[step];$('cnum').textContent=step===0?'00':step===11?'↻':String(step).padStart(2,'0');$('cphase').textContent=S.ph;$('ctitle').textContent=S.t;$('czh').textContent=S.zh;$('cpy').textContent=S.py;
  $('cline').textContent=step===7&&neg?'Negative resist: the light-hardened parts stay, everything else washes away. The pattern comes out reversed.':S.l;$('ckey').textContent=S.k[0];$('ckeyl').textContent=S.k[1];
  $('cwarn').innerHTML=S.w?'<b>If it goes wrong:</b> '+S.w:'';
  [...rail.children].forEach((b,j)=>{b.className=j+1===step?'on':(j+1<step||step===11)?'done':''});speak(step)}
function updPlay(){$('play').textContent=playing?'❚❚ Pause':'▶ Play all'}
$('prev').onclick=()=>go(step-1);$('next').onclick=()=>go(step+1);
$('play').onclick=()=>{ac();playing=!playing;if(playing&&step===11)go(0);else if(playing)t0=performance.now()-0;updPlay()};
$('snd').onclick=e=>{sound=!sound;e.currentTarget.setAttribute('aria-pressed',sound)};
$('voice').onclick=e=>{voice=!voice;e.currentTarget.setAttribute('aria-pressed',voice);speak(step)};
$('neg').onclick=e=>{neg=!neg;e.currentTarget.setAttribute('aria-pressed',neg);go(step)};
$('fs').onclick=()=>{const d=document.documentElement;try{document.fullscreenElement?document.exitFullscreen():d.requestFullscreen().catch(()=>{})}catch(e){}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){ac();go(step+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(step-1);else if(e.key===' '){e.preventDefault();$('play').click()}else if(e.key==='n'||e.key==='N')$('neg').click();else if(e.key==='f'||e.key==='F')$('fs').click()});
const h=location.hash.match(/^#step-(\d+)$/);go(h?+h[1]:0);requestAnimationFrame(frame);
}
</script>
